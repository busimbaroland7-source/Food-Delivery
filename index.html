<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style - Plateforme Mondiale Multi-Services</title>
    <style>
        :root {
            --primary: #ff6600;
            --primary-dark: #e65c00;
            --bg-dark: #0b0f19;
            --bg-card: rgba(17, 24, 39, 0.7);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 102, 0, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 40%);
        }

        /* Effet futuriste / Glassmorphism */
        .glass-panel {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Écran d'authentification */
        #auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(20px);
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            text-align: center;
        }

        .auth-card h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff6600, #ff9933);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .auth-card p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff6600, #ff8533);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.4);
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 102, 0, 0.6);
        }

        /* Application principale (Workspace) */
        #app-workspace {
            display: none;
            opacity: 0;
            transition: opacity 0.6s ease;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            margin-bottom: 30px;
        }

        .logo-area {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6600, #ff9933);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-glass);
        }

        .user-badge span {
            font-weight: 600;
            color: var(--primary);
        }

        /* Grille des catégories exhaustives avec symboles */
        .categories-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
        }

        .category-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 18px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .category-card:hover, .category-card.active {
            border-color: var(--primary);
            transform: translateY(-4px);
            background: rgba(255, 102, 0, 0.1);
            box-shadow: 0 10px 25px -5px rgba(255, 102, 0, 0.2);
        }

        .category-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .category-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
        }

        /* Espace de publication multimédia */
        .publish-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (max-width: 900px) {
            .publish-container {
                grid-template-columns: 1fr;
            }
        }

        .publish-card {
            padding: 30px;
        }

        .form-row {
            margin-bottom: 15px;
        }

        .form-row label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-row input, .form-row select, .form-row textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
        }

        .form-row textarea {
            resize: vertical;
            height: 80px;
        }

        .media-dropzone {
            border: 2px dashed var(--border-glass);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: background 0.3s;
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 15px;
        }

        .media-dropzone:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
        }

        /* Grille des flux / produits publiés */
        .feed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .item-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 102, 0, 0.4);
        }

        .item-media {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #1a202c;
        }

        .item-content {
            padding: 15px;
        }

        .item-niche {
            font-size: 0.75rem;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .item-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .item-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: #10b981;
        }

        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-top: 1px solid var(--border-glass);
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Écran d'authentification (Effet Waouh / Futuriste) -->
    <div id="auth-screen">
        <div class="glass-panel auth-card">
            <h1>STYLE</h1>
            <p>Accédez au futur du commerce mondial multi-services</p>
            <form id="login-form">
                <div class="input-group">
                    <label for="user-name">Nom</label>
                    <input type="text" id="user-name" required placeholder="Ex: Roland">
                </div>
                <div class="input-group">
                    <label for="user-postname">Post-nom</label>
                    <input type="text" id="user-postname" required placeholder="Ex: Busimba">
                </div>
                <div class="input-group">
                    <label for="user-code">Code d'accès unique</label>
                    <input type="password" id="user-code" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Entrer dans l'Espace de Travail</button>
            </form>
        </div>
    </div>

    <!-- Espace de Travail Principal (Workspace) -->
    <div id="app-workspace">
        <header class="glass-panel">
            <div class="logo-area">STYLE. WORKSPACE</div>
            <div class="user-badge">
                <span>Connecté :</span> <strong id="display-username">Utilisateur</strong>
            </div>
        </header>

        <!-- Section des Catégories Exhaustives -->
        <section class="categories-section">
            <div class="section-title">✨ Sélectionnez votre Niche & Catégories</div>
            <div class="categories-grid" id="categories-container">
                <!-- Généré dynamiquement par JavaScript -->
            </div>
        </section>

        <!-- Espace de Publication Multimédia Compact & Avancé -->
        <div class="publish-container">
            <div class="glass-panel publish-card">
                <div class="section-title" style="font-size: 1.1rem; margin-bottom: 15px;">🚀 Publier un Produit / Service</div>
                <form id="publish-form">
                    <div class="form-row">
                        <label>Niche / Catégorie sélectionnée</label>
                        <select id="pub-category" required>
                            <option value="">-- Choisir une catégorie --</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>Titre de l'offre</label>
                        <input type="text" id="pub-title" required placeholder="ex: Paves écologiques en plastique">
                    </div>
                    <div class="form-row">
                        <label>Prix ($)</label>
                        <input type="number" id="pub-price" step="0.01" required placeholder="0.00">
                    </div>
                    <div class="form-row">
                        <label>Média (Photo ou Vidéo max 5 sec)</label>
                        <div class="media-dropzone" id="dropzone">
                            📁 Glissez ou cliquez pour charger photo/vidéo (5s max)
                            <input type="file" id="pub-file" accept="image/*,video/*" style="display: none;">
                        </div>
                    </div>
                    <div class="form-row">
                        <label>Description rapide</label>
                        <textarea id="pub-desc" placeholder="Détails essentiels..."></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Publier instantanément</button>
                </form>
            </div>

            <!-- Flux des publications en temps réel -->
            <div>
                <div class="section-title">🔥 Flux d'activités & Catalogue en direct</div>
                <div class="feed-grid" id="feed-container">
                    <!-- Les publications s'afficheront ici -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Liste exhaustive des catégories avec symboles
        const categories = [
            { id: 'constr', name: 'Construction & Matériaux', symbol: '🏗️' },
            { id: 'tech', name: 'E-commerce & High-Tech', symbol: '💻' },
            { id: 'agri', name: 'Agriculture & Élevage', symbol: '🌱' },
            { id: 'logi', name: 'Livraison & Logistique', symbol: '🚀' },
            { id: 'mode', name: 'Mode & Vêtements', symbol: '👕' },
            { id: 'immo', name: 'Immobilier & Terrains', symbol: '🏢' },
            { id: 'sante', name: 'Santé & Bien-être', symbol: '💊' },
            { id: 'auto', name: 'Véhicules & Pièces', symbol: '🚗' },
            { id: 'alim', name: 'Alimentation & Boissons', symbol: '🍎' },
            { id: 'serv', name: 'Services Professionnels', symbol: '⚙️' }
        ];

        let selectedCategoryFilter = null;

        // Initialisation de l'interface des catégories
        function initCategories() {
            const container = document.getElementById('categories-container');
            const selectDropdown = document.getElementById('pub-category');
            
            container.innerHTML = '';
            selectDropdown.innerHTML = '<option value="">-- Choisir une catégorie --</option>';

            categories.forEach(cat => {
                // Remplissage de la grille interactive
                const card = document.createElement('div');
                card.className = 'category-card';
                card.innerHTML = `
                    <div class="category-icon">${cat.symbol}</div>
                    <div class="category-name">${cat.name}</div>
                `;
                card.onclick = () => filterByCategory(cat.id, card);
                container.appendChild(card);

                // Remplissage du menu déroulant de publication
                const option = document.createElement('option');
                option.value = cat.id;
                option.textContent = `${cat.symbol} ${cat.name}`;
                selectDropdown.appendChild(option);
            });
        }

        function filterByCategory(catId, element) {
            document.querySelectorAll('.category-card').forEach(c => c.classList.remove('active'));
            if (selectedCategoryFilter === catId) {
                selectedCategoryFilter = null;
            } else {
                selectedCategoryFilter = catId;
                element.classList.add('active');
            }
            renderFeed();
        }

        // Gestion de l'authentification (Nom, Post-nom, Code)
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('user-name').value.trim();
            const postname = document.getElementById('user-postname').value.trim();
            const code = document.getElementById('user-code').value.trim();

            if (name && postname && code) {
                document.getElementById('display-username').textContent = `${name} ${postname}`;
                
                // Animation de transition futuriste vers l'espace de travail
                const authScreen = document.getElementById('auth-screen');
                authScreen.style.opacity = '0';
                authScreen.style.visibility = 'hidden';

                const workspace = document.getElementById('app-workspace');
                workspace.style.display = 'block';
                setTimeout(() => {
                    workspace.style.opacity = '1';
                }, 50);
            }
        });

        // Gestion du chargement de fichiers (Glisser-déposer / Clic)
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('pub-file');

        dropzone.onclick = () => fileInput.click();

        fileInput.onchange = (e) => {
            if (e.target.files.length > 0) {
                dropzone.innerHTML = `✅ Fichier sélectionné : <strong>${e.target.files[0].name}</strong>`;
            }
        };

        // Base de données locale temporaire pour les publications du flux
        let publications = [
            {
                id: 1,
                category: 'constr',
                title: 'Pavés écologiques en plastique recyclé',
                price: 15.00,
                desc: 'Résistants et durables pour vos chantiers.',
                mediaUrl: 'https://images.unsplash.com/photo-1590069261209-f8e9b8642343?auto=format&fit=crop&w=500&q=80',
                date: 'Aujourd\'hui'
            },
            {
                id: 2,
                category: 'logi',
                title: 'Service de Livraison Express Multi-Services',
                price: 5.00,
                desc: 'Livraison rapide avec suivi sécurisé par code.',
                mediaUrl: 'https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=500&q=80',
                date: 'Aujourd\'hui'
            }
        ];

        // Soumission du formulaire de publication
        document.getElementById('publish-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const category = document.getElementById('pub-category').value;
            const title = document.getElementById('pub-title').value;
            const price = parseFloat(document.getElementById('pub-price').value);
            const desc = document.getElementById('pub-desc').value;

            // Simulation d'une image/vidéo par défaut si aucun fichier joint
            let mediaUrl = 'https://images.unsplash.com/photo-1557804506-669a67965ba0?auto=format&fit=crop&w=500&q=80';
            if (fileInput.files.length > 0) {
                mediaUrl = URL.createObjectURL(fileInput.files[0]);
            }

            const newPub = {
                id: Date.now(),
                category,
                title,
                price,
                desc,
                mediaUrl,
                date: 'À l\'instant'
            };

            publications.unshift(newPub);
            renderFeed();
            this.reset();
            dropzone.innerHTML = '📁 Glissez ou cliquez pour charger photo/vidéo (5s max)';
            alert('Publication effectuée avec succès dans votre espace de niche !');
        });

        // Affichage dynamique du flux
        function renderFeed() {
            const feedContainer = document.getElementById('feed-container');
            feedContainer.innerHTML = '';

            const filtered = selectedCategoryFilter 
                ? publications.filter(p => p.category === selectedCategoryFilter)
                : publications;

            if (filtered.length === 0) {
                feedContainer.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 40px;">Aucune publication dans cette catégorie pour le moment.</p>';
                return;
            }

            filtered.forEach(pub => {
                const catObj = categories.find(c => c.id === pub.category);
                const card = document.createElement('div');
                card.className = 'item-card glass-panel';
                card.innerHTML = `
                    <img src="${pub.mediaUrl}" class="item-media" alt="Média publication">
                    <div class="item-content">
                        <div class="item-niche">${catObj ? catObj.symbol + ' ' + catObj.name : 'Général'}</div>
                        <div class="item-title">${pub.title}</div>
                        <div class="item-price">$${pub.price.toFixed(2)}</div>
                        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 5px;">${pub.desc}</p>
                    </div>
                    <div class="item-footer">
                        <span>Publié ${pub.date}</span>
                        <span style="color: var(--primary); font-weight: 600; cursor: pointer;">Détails ➔</span>
                    </div>
                `;
                feedContainer.appendChild(card);
            });
        }

        // Lancement initial
        initCategories();
        renderFeed();
    </script>
</body>
</html>
