<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style - Plateforme Mondiale Multi-Services</title>
    <style>
        :root {
            --primary: #ff6600;
            --primary-dark: #e65c00;
            --bg-dark: #0b0f19;
            --bg-card: rgba(17, 24, 39, 0.7);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 102, 0, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 40%);
        }

        .glass-panel {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Application principale */
        #app-workspace {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            margin-bottom: 30px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo-area {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6600, #ff9933);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Barre de recherche et accès admin intégré */
        .search-admin-bar {
            flex: 1;
            max-width: 500px;
            display: flex;
            position: relative;
        }

        .search-admin-bar input {
            width: 100%;
            padding: 12px 20px;
            padding-right: 110px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: 30px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-admin-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .admin-login-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, #ff6600, #ff8533);
            border: none;
            border-radius: 20px;
            color: white;
            padding: 8px 15px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .admin-login-btn:hover {
            opacity: 0.9;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-glass);
            font-size: 0.9rem;
        }

        .user-badge span {
            color: var(--primary);
            font-weight: 600;
        }

        .admin-badge {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        /* Catégories */
        .categories-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
        }

        .category-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 18px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .category-card:hover, .category-card.active {
            border-color: var(--primary);
            transform: translateY(-4px);
            background: rgba(255, 102, 0, 0.1);
            box-shadow: 0 10px 25px -5px rgba(255, 102, 0, 0.2);
        }

        .category-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .category-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
        }

        /* Publication & Flux */
        .publish-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (max-width: 900px) {
            .publish-container {
                grid-template-columns: 1fr;
            }
        }

        .publish-card {
            padding: 30px;
        }

        .form-row {
            margin-bottom: 15px;
        }

        .form-row label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-row input, .form-row select, .form-row textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
        }

        .form-row textarea {
            resize: vertical;
            height: 80px;
        }

        .media-dropzone {
            border: 2px dashed var(--border-glass);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: background 0.3s;
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 15px;
        }

        .media-dropzone:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff6600, #ff8533);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.4);
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 102, 0, 0.6);
        }

        .feed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.3s;
            position: relative;
        }

        .item-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 102, 0, 0.4);
        }

        .item-media {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #1a202c;
        }

        .item-content {
            padding: 15px;
        }

        .item-niche {
            font-size: 0.75rem;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .item-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .item-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: #10b981;
        }

        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-top: 1px solid var(--border-glass);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn-delete-admin {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.5);
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-delete-admin:hover {
            background: rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body>

    <!-- Espace de Travail Principal -->
    <div id="app-workspace">
        <header class="glass-panel">
            <div class="logo-area">STYLE</div>
            
            <!-- Barre de recherche & Accès Admin -->
            <div class="search-admin-bar">
                <input type="text" id="search-input" placeholder="Rechercher un produit, service..." oninput="handleSearch()">
                <button class="admin-login-btn" onclick="promptAdminAccess()">Admin</button>
            </div>

            <div class="user-badge">
                <span>Rôle :</span> 
                <strong id="display-role">Membre</strong>
                <span id="admin-badge-container"></span>
            </div>
        </header>

        <!-- Section des Catégories (Inclut TOUT et LIVRAISON) -->
        <section class="categories-section">
            <div class="section-title">✨ Sélectionnez votre Niche & Catégories</div>
            <div class="categories-grid" id="categories-container"></div>
        </section>

        <!-- Espace de Publication et Flux -->
        <div class="publish-container">
            <div class="glass-panel publish-card">
                <div class="section-title" style="font-size: 1.1rem; margin-bottom: 15px;">🚀 Publier un Produit / Service</div>
                <form id="publish-form">
                    <div class="form-row">
                        <label>Niche / Catégorie obligatoire</label>
                        <select id="pub-category" required>
                            <option value="">-- Choisir une niche --</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>Titre de l'offre</label>
                        <input type="text" id="pub-title" required placeholder="ex: Pavés écologiques / Livraison...">
                    </div>
                    <div class="form-row">
                        <label>Prix ($)</label>
                        <input type="number" id="pub-price" step="0.01" required placeholder="0.00">
                    </div>
                    <div class="form-row">
                        <label>Média (Photo ou Vidéo max 5s)</label>
                        <div class="media-dropzone" id="dropzone">
                            📁 Glissez ou cliquez pour charger photo/vidéo
                            <input type="file" id="pub-file" accept="image/*,video/*" style="display: none;">
                        </div>
                    </div>
                    <div class="form-row">
                        <label>Description rapide</label>
                        <textarea id="pub-desc" placeholder="Détails essentiels..."></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Publier dans le flux permanent</button>
                </form>
            </div>

            <!-- Flux des publications persistantes -->
            <div>
                <div class="section-title">🔥 Flux d'activités & Catalogue en direct</div>
                <div class="feed-grid" id="feed-container"></div>
            </div>
        </div>
    </div>

    <script>
        // Catalogue complet incluant TOUT, LIVRAISON, et les autres secteurs
        const categories = [
            { id: 'all', name: 'Tout', symbol: '🌐' },
            { id: 'livr', name: 'Livraison', symbol: '🚚' },
            { id: 'constr', name: 'Construction & Matériaux', symbol: '🏗️' },
            { id: 'tech', name: 'E-commerce & High-Tech', symbol: '💻' },
            { id: 'agri', name: 'Agriculture & Élevage', symbol: '🌱' },
            { id: 'logi', name: 'Logistique & Transport', symbol: '🚀' },
            { id: 'mode', name: 'Mode & Vêtements', symbol: '👕' },
            { id: 'immo', name: 'Immobilier & Terrains', symbol: '🏢' },
            { id: 'sante', name: 'Santé & Bien-être', symbol: '💊' },
            { id: 'auto', name: 'Véhicules & Pièces', symbol: '🚗' },
            { id: 'alim', name: 'Alimentation & Boissons', symbol: '🍎' },
            { id: 'serv', name: 'Services Professionnels', symbol: '⚙️' }
        ];

        let selectedCategoryFilter = 'all';
        let searchQuery = '';
        let currentUser = { isAdmin: false };

        // Initialisation des catégories graphiques et du menu déroulant de publication
        function initCategories() {
            const container = document.getElementById('categories-container');
            const selectDropdown = document.getElementById('pub-category');
            
            container.innerHTML = '';
            selectDropdown.innerHTML = '<option value="">-- Choisir une niche --</option>';

            categories.forEach(cat => {
                // Bouton cliquable de la grille
                const card = document.createElement('div');
                card.className = `category-card ${cat.id === 'all' ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="category-icon">${cat.symbol}</div>
                    <div class="category-name">${cat.name}</div>
                `;
                card.onclick = () => filterByCategory(cat.id, card);
                container.appendChild(card);

                // Option dans le formulaire de publication (sauf "Tout")
                if (cat.id !== 'all') {
                    const option = document.createElement('option');
                    option.value = cat.id;
                    option.textContent = `${cat.symbol} ${cat.name}`;
                    selectDropdown.appendChild(option);
                }
            });
        }

        function filterByCategory(catId, element) {
            document.querySelectorAll('.category-card').forEach(c => c.classList.remove('active'));
            selectedCategoryFilter = catId;
            element.classList.add('active');
            renderFeed();
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
            renderFeed();
        }

        // Accès administrateur sécurisé via la barre de recherche
        function promptAdminAccess() {
            const code = prompt('Entrez le code d\'accès administrateur :');
            if (code === 'ADMIN99') {
                currentUser.isAdmin = true;
                document.getElementById('display-role').textContent = 'Administrateur';
                document.getElementById('admin-badge-container').innerHTML = '<span class="admin-badge">ADMIN</span>';
                alert('Accès administrateur accordé avec succès ! Vous pouvez maintenant supprimer des publications.');
                renderFeed();
            } else if (code !== null) {
                alert('Code d\'accès incorrect.');
            }
        }

        // Gestion du chargement de fichiers multimédias
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('pub-file');

        dropzone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            if (e.target.files.length > 0) {
                dropzone.innerHTML = `✅ Fichier sélectionné : <strong>${e.target.files[0].name}</strong>`;
            }
        };

        // Persistance des données avec localStorage
        function getSavedPublications() {
            const data = localStorage.getItem('style_app_publications');
            if (data) {
                try { return JSON.parse(data); } catch (err) { return getDefaultPublications(); }
            }
            return getDefaultPublications();
        }

        function savePublications(pubs) {
            localStorage.setItem('style_app_publications', JSON.stringify(pubs));
        }

        function getDefaultPublications() {
            return [
                {
                    id: 1,
                    category: 'livr',
                    title: 'Service de Livraison Express Sécurisé',
                    price: 5.00,
                    desc: 'Livraison rapide de colis et marchandises en ville avec suivi.',
                    mediaUrl: 'https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=500&q=80',
                    author: 'Équipe Logistique',
                    date: 'Aujourd\'hui'
                },
                {
                    id: 2,
                    category: 'constr',
                    title: 'Pavés écologiques en plastique recyclé',
                    price: 15.00,
                    desc: 'Résistants et durables pour tous vos aménagements.',
                    mediaUrl: 'https://images.unsplash.com/photo-1590069261209-f8e9b8642343?auto=format&fit=crop&w=500&q=80',
                    author: 'Roland B.',
                    date: 'Aujourd\'hui'
                }
            ];
        }

        // Soumission de publication enregistrée durablement
        document.getElementById('publish-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const category = document.getElementById('pub-category').value;
            const title = document.getElementById('pub-title').value;
            const price = parseFloat(document.getElementById('pub-price').value);
            const desc = document.getElementById('pub-desc').value;

            let mediaUrl = 'https://images.unsplash.com/photo-1557804506-669a67965ba0?auto=format&fit=crop&w=500&q=80';
            if (fileInput.files.length > 0) {
                mediaUrl = URL.createObjectURL(fileInput.files[0]);
            }

            const newPub = {
                id: Date.now(),
                category,
                title,
                price,
                desc,
                mediaUrl,
                author: currentUser.isAdmin ? 'Administrateur' : 'Membre',
                date: 'À l\'instant'
            };

            let publications = getSavedPublications();
            publications.unshift(newPub);
            savePublications(publications);

            renderFeed();
            this.reset();
            dropzone.innerHTML = '📁 Glissez ou cliquez pour charger photo/vidéo';
            alert('Publication enregistrée et ajoutée au flux permanent !');
        });

        // Suppression (Réservée exclusivement à l'administration)
        window.deletePublication = function(id) {
            if (!currentUser.isAdmin) {
                alert('Action refusée : Seuls les membres de l\'administration peuvent supprimer une publication.');
                return;
            }
            if (confirm('Voulez-vous vraiment supprimer définitivement cette publication ?')) {
                let publications = getSavedPublications();
                publications = publications.filter(p => p.id !== id);
                savePublications(publications);
                renderFeed();
            }
        };

        // Affichage dynamique et filtré du flux
        function renderFeed() {
            const feedContainer = document.getElementById('feed-container');
            feedContainer.innerHTML = '';

            let publications = getSavedPublications();

            // Filtrage par catégorie (si ce n'est pas "all")
            if (selectedCategoryFilter !== 'all') {
                publications = publications.filter(p => p.category === selectedCategoryFilter);
            }

            // Filtrage par recherche textuelle (barre de recherche en haut)
            if (searchQuery) {
                publications = publications.filter(p => 
                    p.title.toLowerCase().includes(searchQuery) || 
                    p.desc.toLowerCase().includes(searchQuery)
                );
            }

            if (publications.length === 0) {
                feedContainer.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 40px;">Aucune publication trouvée.</p>';
                return;
            }

            publications.forEach(pub => {
                const catObj = categories.find(c => c.id === pub.category);
                const card = document.createElement('div');
                card.className = 'item-card glass-panel';
                
                let adminControlHtml = '';
                if (currentUser.isAdmin) {
                    adminControlHtml = `<button class="btn-delete-admin" onclick="deletePublication(${pub.id})">🗑️ Supprimer (Admin)</button>`;
                }

                card.innerHTML = `
                    <img src="${pub.mediaUrl}" class="item-media" alt="Média publication">
                    <div class="item-content">
                        <div class="item-niche">${catObj ? catObj.symbol + ' ' + catObj.name : 'Général'}</div>
                        <div class="item-title">${pub.title}</div>
                        <div class="item-price">$${pub.price.toFixed(2)}</div>
                        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 5px;">${pub.desc}</p>
                        <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 8px;">Par : <strong>${pub.author || 'Membre'}</strong></p>
                    </div>
                    <div class="item-footer">
                        <span>${pub.date}</span>
                        ${adminControlHtml}
                    </div>
                `;
                feedContainer.appendChild(card);
            });
        }

        // Lancement initial
        initCategories();
        renderFeed();
    </script>
</body>
</html>
